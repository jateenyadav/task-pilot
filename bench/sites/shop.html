<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Chai Gear shop</title></head><body><h1>Chai Gear</h1><p>Cart: <b id="c">0</b> items</p>
<input id="q" placeholder="Search products" aria-label="Search products"> <button id="s">Search</button><div id="r"></div>
<script>const P=[['Steel Electric Kettle 1.5L',1299],['Glass Electric Kettle 1.7L',1849],['Mini Electric Kettle 0.8L',899],['Copper Tumbler Pair',899],['Brass Tea Kettle (stove)',1450],['Travel Electric Kettle 0.5L',1099]];
const cart=JSON.parse(sessionStorage.getItem('cart')||'[]');const c=document.getElementById('c');c.textContent=cart.length;
const show=(q)=>{const r=document.getElementById('r');r.innerHTML='';P.filter(p=>p[0].toLowerCase().includes(q.toLowerCase())).forEach(p=>{const d=document.createElement('div');d.className='card';d.innerHTML='<b>'+p[0]+'</b> — ₹'+p[1]+' ';const b=document.createElement('button');b.textContent='Add to cart: '+p[0];b.onclick=()=>{cart.push(p[0]);sessionStorage.setItem('cart',JSON.stringify(cart));c.textContent=cart.length};d.appendChild(b);r.appendChild(d)})};
document.getElementById('s').onclick=()=>show(document.getElementById('q').value);document.getElementById('q').onkeydown=(e)=>{if(e.key==='Enter')show(e.target.value)};</script></body></html>
