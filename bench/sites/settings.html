<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Settings</title></head><body><h1>Settings</h1><div class="card"><label><input type="checkbox" id="dark"> Dark mode</label></div><div class="card"><label><input type="checkbox" id="email" checked> Email notifications</label></div>
<button class="primary" id="save">Save settings</button> <span id="m"></span>
<script>document.getElementById('save').onclick=()=>{sessionStorage.setItem('settings',JSON.stringify({dark:document.getElementById('dark').checked,email:document.getElementById('email').checked}));document.getElementById('m').innerHTML='<span class=ok>Saved</span>'};</script></body></html>
