<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Delivery checkout</title></head><body><h1>Delivery details</h1><p><label>City <select id="city"><option value="">Select city</option><option>Mumbai</option><option>Pune</option><option>Hyderabad</option><option>Chennai</option></select></label></p>
<fieldset><legend>Delivery speed</legend><label><input type="radio" name="speed" value="standard" checked> Standard (free)</label><br><label><input type="radio" name="speed" value="express"> Express (₹99)</label></fieldset>
<p><button class="primary" id="go">Continue</button> <span id="m"></span></p>
<script>document.getElementById('go').onclick=()=>{const s=document.querySelector('input[name=speed]:checked').value;sessionStorage.setItem('delivery',JSON.stringify({city:document.getElementById('city').value,speed:s}));document.getElementById('m').innerHTML='<span class=ok>Saved</span>'};</script></body></html>
